<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abahizi Platform – Login</title>
<link rel="stylesheet" href="login.css?v=4">
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
  <symbol id="ic-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.9 4.2A10.8 10.8 0 0112 4c6.5 0 10 7 10 7a17.9 17.9 0 01-3.1 4.1M6.6 6.6C4 8.3 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
</svg>


<div class="login-container">

  <div class="login-left">
    <h1 class="logo">Abahizi</h1>
    <p class="subtitle">Digital Learning Platform</p>
    <div class="feature-list">
      <div class="feature-item">Curriculum textbooks &amp; past papers</div>
      <div class="feature-item">Assignments &amp; online tests</div>
      <div class="feature-item">Track your academic progress</div>
      <div class="feature-item">Message teachers &amp; classmates</div>
      <div class="feature-item">Canvas virtual notebook</div>
    </div>
  </div>

  <div class="login-right">

    <div style="text-align:right;margin-bottom:8px">
      <select class="lang-sel" id="langSel" onchange="setLang(this.value)" style="width:auto;display:inline-block;padding:6px 10px;font-size:12px">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="rw">Kinyarwanda</option>
      </select>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTabBtn" onclick="switchTab('login')" data-i18n="auth.loginTab">Login</button>
      <button class="auth-tab" id="registerTabBtn" onclick="switchTab('register')" data-i18n="auth.registerTab">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="loginPanel">
      <h2 data-i18n="auth.welcomeBack">Welcome Back</h2>
      <p class="sub" data-i18n="auth.signInToContinue">Sign in to continue learning</p>
      <form id="loginForm">
        <label data-i18n="common.email">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@school.com" required>
        <label data-i18n="common.password">Password</label>
        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="Your password" data-i18n-placeholder="auth.yourPassword" required>
          <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Show password"><svg class="icon-sm"><use href="#ic-eye"></use></svg></button>
        </div>
        <p class="err" id="loginErr"></p>
        <button type="submit" id="loginBtn" data-i18n="auth.loginBtn">Login</button>
      </form>
      <div class="extra-links"><a href="#" data-i18n="auth.forgotPassword">Forgot password?</a></div>
    </div>

    <!-- REGISTER -->
    <div id="registerPanel" style="display:none">
      <h2 data-i18n="auth.createAccount">Create Account</h2>
      <p class="sub" data-i18n="auth.joinPlatform">Join the Abahizi platform</p>
      <form id="registerForm">
        <div class="name-row">
          <div><label data-i18n="common.firstName">First Name</label><input type="text" id="regFirst" placeholder="First name" data-i18n-placeholder="common.firstName" required></div>
          <div><label data-i18n="common.lastName">Last Name</label><input type="text" id="regLast" placeholder="Last name" data-i18n-placeholder="common.lastName" required></div>
        </div>
        <label data-i18n="common.email">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@school.com" required>
        <label data-i18n="common.password">Password</label>
        <div class="password-field">
          <input type="password" id="regPassword" placeholder="Min 8 characters" data-i18n-placeholder="auth.min8chars" required>
          <button type="button" class="pw-toggle" onclick="togglePassword('regPassword', this)" aria-label="Show password"><svg class="icon-sm"><use href="#ic-eye"></use></svg></button>
        </div>
        <label data-i18n="common.confirmPassword">Confirm Password</label>
        <div class="password-field">
          <input type="password" id="regConfirmPassword" placeholder="Re-enter your password" data-i18n-placeholder="auth.reenterPassword" required>
          <button type="button" class="pw-toggle" onclick="togglePassword('regConfirmPassword', this)" aria-label="Show password"><svg class="icon-sm"><use href="#ic-eye"></use></svg></button>
        </div>
        <label data-i18n="auth.role">Role</label>
        <select id="regRole" onchange="onRegRoleChange()">
          <option value="student" data-i18n="auth.student">Student</option>
          <option value="facilitator" data-i18n="auth.facilitator">Facilitator (Teacher)</option>
          <option value="admin" data-i18n="auth.administrator">Administrator</option>
        </select>

        <div id="regStudentFields">
          <label><span data-i18n="common.school">School</span> <span style="font-weight:normal;color:#999">(if you're currently studying)</span></label>
          <input type="text" id="regSchool" placeholder="Your school name" data-i18n-placeholder="auth.yourSchoolName">
          <label><span data-i18n="common.grade">Grade Level</span> <span style="font-weight:normal;color:#999" data-i18n="auth.optional">(optional)</span></label>
          <input type="text" id="regGrade" placeholder="e.g. S4" data-i18n-placeholder="auth.gradeExample">
        </div>

        <div class="name-row">
          <div><label>Country</label><input type="text" id="regCountry" list="countryList" placeholder="Your country" autocomplete="off"></div>
          <div><label>City</label><input type="text" id="regCity" placeholder="Your city"></div>
        </div>
        <datalist id="countryList"></datalist>
        <label>Nationality</label>
        <input type="text" id="regNationality" placeholder="e.g. Rwandan">
        <label>Languages Spoken</label>
        <div id="regLanguages"></div>
        <label id="regGoalsLabel">Goals</label>
        <div id="regGoals"></div>
        <p class="err" id="registerErr"></p>
        <button type="submit" id="registerBtn" data-i18n="auth.createAccountBtn">Create Account</button>
      </form>
    </div>

  </div>
</div>

<script src="../js/api.js?v=2"></script>
<script src="../js/i18n.js?v=2"></script>
<script src="../js/multiPicker.js?v=1"></script>
<script src="login.js?v=5"></script>
</body>
</html>
